# Build the docs and deploy the site to GitHub Pages.
# Published tree: site/ at the root, the Starlight build of docs/ at /docs.
# Nothing else in the repository is served.
# The reference pages come from the latest wats release, fetched at build
# time (docs/scripts/import-wats.mjs): the daily run picks up a new one.
name: Deploy site and docs to Pages

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Build docs
        working-directory: docs
        env:
          # Read-only use of the GitHub API (the latest wats release); a
          # token only raises the rate limit.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npm ci --no-audit --no-fund
          npm run build
          jq -r '"Reference pages from \(.repo) \(.ref) (\(.sha))"' src/generated/wats.json >> "$GITHUB_STEP_SUMMARY"
      - name: Assemble site
        run: |
          mkdir _site
          cp -R site/. _site/
          cp -R docs/dist _site/docs
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
